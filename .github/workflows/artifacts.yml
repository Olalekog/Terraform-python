name: Upload deployment artifact
on:
  # Every push to main uploads a new artifact; it can still be run by hand too.
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  id-token: write
  contents: read

# Repository variables (Settings > Secrets and variables > Actions > Variables).
env:
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  ENVIRONMENT: ${{ vars.ENVIRONMENT }}
  PROJECT_NAME: ${{ vars.PROJECT_NAME }}
  ROLE_TO_ASSUME: ${{ vars.ROLE_TO_ASSUME }}

jobs:
  upload:
    runs-on: ubuntu-latest
    # The GitHub environment that holds the external ID secret and the artifact bucket.
    environment: ${{ vars.ENVIRONMENT }}
    steps:
      - uses: actions/checkout@v4

      - name: Check configuration
        env:
          ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
        run: |
          for name in AWS_ACCOUNT_ID AWS_REGION ENVIRONMENT PROJECT_NAME ROLE_TO_ASSUME ARTIFACT_BUCKET; do
            if [ -z "${!name}" ]; then
              echo "::error::$name GitHub variable is required."
              exit 1
            fi
          done
          if [ ! -f python/targets.json ]; then
            echo "::error::python/targets.json is missing. Copy python/targets.example.json, fill in the role ARNs and commit it with: git add -f python/targets.json"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The helper refuses to run as any role other than the target's source role,
      # so ROLE_TO_ASSUME must match the one in python/targets.json.
      - name: Check ROLE_TO_ASSUME against python/targets.json
        run: |
          python - <<'EOF'
          import json, os, sys
          targets = json.load(open("python/targets.json"))
          environment = os.environ["ENVIRONMENT"]
          if environment not in targets:
              sys.exit(f"::error::python/targets.json has no '{environment}' target.")
          configured = targets[environment]["source_role_arn"]
          if configured != os.environ["ROLE_TO_ASSUME"]:
              sys.exit(f"::error::ROLE_TO_ASSUME does not match the '{environment}' source_role_arn in python/targets.json ({configured}).")
          EOF

      # The role's OIDC trust must allow this repository and environment.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: ${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}-${{ github.run_id }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - run: python -m pip install -r requirements-lock.txt

      - name: Upload under scoped prefix
        env:
          CICD_DEV_EXTERNAL_ID: ${{ secrets.CICD_DEV_EXTERNAL_ID }}
          ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
        run: |
          python python/assume_role.py --config python/targets.json --target "${ENVIRONMENT}" \
            --session-name "${PROJECT_NAME}-${ENVIRONMENT}-${{ github.run_id }}" --duration 900 -- \
            aws s3 cp README.md "s3://${ARTIFACT_BUCKET}/releases/${ENVIRONMENT}/${PROJECT_NAME}-build-${{ github.run_id }}.md"
